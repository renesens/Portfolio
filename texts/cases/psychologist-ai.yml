hero:
  tag: "AI chatbots · Psychologist"
  title: "A bot that knows when to <em>call a human</em>"
  subtitle: "An AI system for a psychologist. It answers questions, sells products and books sessions, and it passes sensitive questions to a person."
  company_label: "Client"
  company: "Practising psychologist"
  role: "System design, build in ManyChat and Make, integrations"
