qa:
  note: "my QA habit"
  title: "What could go wrong — tested before launch"
  text: "I built layered error handling into the scenario and tested these cases before launch."
  cards:
    - title: "The same email again"
      text: "Skipped by Message-ID — no second lead."
    - title: "A returning customer"
      text: "Added to the existing lead's history."
    - title: "A changed email format"
      text: "The error handling catches it, so the scenario keeps working."
    - title: "Empty fields or an API error"
      text: "The same error handling catches these too."

result:
  note: "the result"
  title: "What changed"
  cards:
    - title: "No manual transfer"
      text: "Email requests appear straight in the CRM."
    - title: "Duplicates filtered out"
      text: "Each email is processed once; repeat requests stay with their lead."
    - title: "Full context"
      text: "Every lead keeps a link to the original email."
    - title: "Consistent data"
      text: "Uniform leads for follow-up and reporting."

