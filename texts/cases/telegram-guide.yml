problem:
  note: "the problem"
  title: "Up to 3 hours a day went to chats and a notebook"
  paragraphs:
    - "The guide copied data from chats into her notebook and answered the same questions again and again."
    - "Answers came late. And clients who clicked “Book” but didn't choose a time were simply lost."
  stickers: ["Up to 3 hours a day", "The same questions", "Clicked “Book”, then gone"]

solution:
  note: "what I built"
  title: "A bot that keeps the booking moving"
  text: "I looked at the guide's daily routine first and mapped the booking and chat flow in Miro. Then I built it in ManyChat and Make."
  steps:
    - title: "Track every click."
      text: "The bot records each click in the funnel."
    - title: "Answer typical questions."
      text: "The AI FAQ answers about 90% of them."
    - title: "Find stuck bookings."
      text: "If a client clicks “Book” and picks a time, the booking goes through Calendly. If not, the bot marks this client as stuck."
      accent: true
    - title: "Send a gentle reminder."
      text: "A short message brings the client back to the booking."
      accent: true
    - title: "Save the data."
      text: "All data goes to Google Sheets in a clear structure, so nobody copies it by hand."

diagram:
  aria: "Booking flow in Telegram. Every click is tracked and the AI FAQ answers typical questions. If a client clicks Book and picks a time, the booking continues. If not, the client is marked as stuck and gets a gentle reminder that leads back to the booking. Data from both branches goes to Google Sheets."
  n1_title: "Client in the Telegram bot"
  n1_text: "Every click is tracked"
