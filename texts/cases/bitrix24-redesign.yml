problem:
  note: "the problem"
  title: "Everything lived in one lead pipeline"
  paragraphs:
    - "Requests came from the website, ads, email, phone and partners. New requests, quotes, talks with clients, postponed deals, service and complaints were all in one pipeline."
    - "So it was hard for the sales team to see who to answer first and what to do next."
  before_aria: "Before: one pipeline holding every type of request"
  before_label: "Before · one pipeline"
  before_items: ["New request", "Complaint", "Quote sent", "Service request", "Negotiation", "Postponed deal"]

solution:
  note: "what I did"
  title: "Mapping the process before touching the CRM"
  paragraphs:
    - "I went through the old Bitrix24 setup and real requests. Then I mapped the real sales process in Miro: how a request comes in, how it is qualified, the follow-up and the result."
    - "I built the new CRM structure from this map."
  bullets:
    - title: "Lead → Deal."
      text: "Qualified leads become deals. Spam and duplicates are closed with a clear reason."
    - title: "Website requests via Make."
      text: "Before a new contact is created, Make searches by phone number, so there are no duplicates."
    - title: "Tasks and reminders."
      text: "Tasks for the first contact, follow-ups after a quote, deposit tracking and automatic deal names."
    - title: "Tested and documented."
      text: "I tested the CRM logic and wrote instructions for the managers."

