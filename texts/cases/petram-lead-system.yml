why:
  note: "why it's built this way"
  title: "The decisions behind the flow"
  text: "A few choices keep the data in order when requests and photos move between systems."
  cards:
    - title: "One Lead ID"
      text: "Every request gets one, from the form or from email. For form requests it follows the request through the database, the automation, the sheet and the Drive folder, so photos stay with the right request."
    - title: "Private photo storage"
      text: "Site photos go to private storage in Lovable Cloud, and the team finds them in the request's Drive folder."
    - title: "A contact check first"
      text: "Make looks for the contact in Bitrix24 before it adds a new one, so one customer doesn't get a second contact."
    - title: "Errors in a log"
      text: "If the AI step or its answer fails, the email scenario writes the error to a log sheet."

result:
  note: "the result"
  title: "What changed"
  text: "This was a new business, so there is no “before” to compare with. The goal was a process that works from the first request."
  cards:
    - title: "69 form requests"
      text: "Saved in the database so far (November 2026)."
    - title: "Leads in Bitrix24"
      text: "Requests from the form and from email become leads in one CRM."
    - title: "Ready to measure"
      text: "Each form request has marketing attribution, so the funnel can be measured."
    - title: "No manual transfer"
      text: "Requests reach Bitrix24 and the team's sheet without copying by hand."

