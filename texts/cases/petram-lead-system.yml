problem:
  note: "the problem"
  title: "One request is more than a name and an email"
  paragraphs:
    - "A request has contact details, pool type, project size, location, free text and several photos of the site. Without the photos, the team can't prepare an accurate offer."
    - "The company had no structured way to collect all this online. With a new website coming, requests could get lost in the inbox."
  stickers: ["Many details in one request", "Several site photos", "No process yet"]

solution:
  note: "what I built"
  title: "Two channels, one CRM"
  text: "I started with how a request should move, from the form to the team. Later I added a second scenario, because some customers skip the form and write an email. Then I connected both to Bitrix24."
  steps:
    - title: "Website form."
      text: "The customer sends the details and the site photos."
    - title: "Save the request."
      text: "The data goes to the Lovable Cloud database and the photos go to private storage."
    - title: "Pass it to Make."
      text: "If the request has photos, Make puts them in a Google Drive folder."
    - title: "Pick up emails."
      text: "A second Make scenario works with emails sent straight to the company inbox. A Data Store shows which emails were already processed."
    - title: "Sort with AI."
      text: "AI decides if the email is a lead and pulls out the data. An email that isn't a lead is logged. An unclear one is marked for a manual check."
      accent: true
    - title: "Create the lead in Bitrix24."
      text: "Make looks for the contact, adds it if it's new, and creates the lead."
      accent: true
    - title: "Update the sheet and the team."
      text: "Each lead gets a row in Google Sheets. For form requests, the team also gets an email."

