# ── How I work ──
process:
  note: "how I work"
  title: "Process first, tools second."
  text: "I start with the business process and the people who use it — then choose the tool."
  steps:
    - title: "1. Audit"
      text: "Trigger, data, owners, expected result."
    - title: "2. Map it out"
      text: "A clear diagram of the flow, fields and rules — agreed before I build."
    - title: "3. Build"
      text: "A first useful version, not a perfect one."
    - title: "4. Break it"
      text: "Empty fields, duplicates, API errors — before launch."
    - title: "5. Hand over"
      text: "Documentation and instructions for the team."

# ── About ──
about:
  photo_alt: "Renata Cherniavska at her desk with a laptop"
  note: "a little about me"
  title: "I used to find where networks broke. Now I find where processes do."
  paragraphs:
    - "For about seven years at Ukrtelecom and Nokia Networks I monitored network performance, troubleshot complex failures and tested equipment before it went live. Then I worked as a QA engineer (API testing in Postman, SQL / PostgreSQL, Jira, Git)."
    - "That's why I think about what can go wrong before it does — and build checks and error handling in from day one."
  chips:
    - "Engineering → understand systems"
    - "QA → check what can go wrong"
    - "Operations → build what people use daily"
  languages: "Languages: English — working · Czech — good · Ukrainian, Russian — native"

